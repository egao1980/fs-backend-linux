name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # The canned matrix: ubuntu in the ci-base container (ext4 / overlay: the
  # FICLONE probe says :unsupported-volume, the reflink tests skip), macOS and
  # Windows (load, off-OS answers, Linux tests skip).
  test:
    uses: egao1980/cl-repository/.github/workflows/test-system.yml@main

  # R4c-2: real reflinks. The ubuntu-latest host (passwordless sudo, not the
  # container) mounts a btrfs and an XFS reflink=1 loop volume, owned by the
  # runner user, and runs the whole test system with
  # FS_BACKEND_LINUX_REFLINK_DIRS pointing at them. With
  # FS_BACKEND_LINUX_REQUIRE_REFLINK=1 a reflink test that cannot run fails
  # instead of skipping, so this job cannot go green by skipping.
  reflink:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      SBCL_VERSION: "2.6.7"
      ROSWELL_VERSION: "26.02.116"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Mount btrfs and XFS reflink loop volumes
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q btrfs-progs xfsprogs e2fsprogs
          for fs in btrfs xfs; do
            truncate -s 1G "$RUNNER_TEMP/$fs.img"
          done
          mkfs.btrfs -q "$RUNNER_TEMP/btrfs.img"
          mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/xfs.img"
          # max_inline=0: btrfs otherwise stores files <= 2 KiB inline in metadata,
          # and FIEMAP reports DATA_INLINE instead of SHARED for their clones.
          sudo mkdir -p /mnt/btrfs /mnt/xfs
          sudo mount -o loop,max_inline=0 "$RUNNER_TEMP/btrfs.img" /mnt/btrfs
          sudo mount -o loop "$RUNNER_TEMP/xfs.img" /mnt/xfs
          for fs in btrfs xfs; do
            sudo chown "$(id -u):$(id -g)" "/mnt/$fs"
          done
          findmnt -T /mnt/btrfs
          findmnt -T /mnt/xfs
          xfs_info /mnt/xfs | grep -o 'reflink=[01]'
          stat -f -c '%T' /tmp /mnt/btrfs /mnt/xfs

      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: test
        env:
          FS_BACKEND_LINUX_REFLINK_DIRS: /mnt/btrfs:/mnt/xfs
          FS_BACKEND_LINUX_REQUIRE_REFLINK: "1"
